outreach:
  candidate_name: "Parmanand"
  candidate_core_tech: ["go", "golang", "node.js", "typescript", "postgresql"]
  candidate_extra_tech: ["docker", "kubernetes", "grpc", "redis", "aws", "microservices"]
  linkedin_search_titles:
    - { title: "Engineering Manager", label: "Eng Manager", category: "engineering" }
    - { title: "Tech Lead", label: "Tech Lead", category: "engineering" }
    - { title: "Head of Engineering", label: "Head of Eng", category: "engineering" }
    - { title: "CTO", label: "CTO", category: "executive" }
    - { title: "CEO Founder", label: "CEO / Founder", category: "executive" }
    - { title: "Technical Recruiter", label: "Tech Recruiter", category: "hr" }
    - { title: "HR Manager", label: "HR Manager", category: "hr" }
  bio_short: "1-2 years building {stack} backends"
  achievements:
    - "Built and shipped production {stack} microservices handling real user traffic."
    - "Designed PostgreSQL schemas and REST/gRPC APIs with sub-200ms p95 latency."
    - "Containerised services with Docker and automated deploys on AWS."
  dm_short_template: "{greeting}, I noticed {company} is hiring for {title}. I have {bio_short} and love working with {stack}. Would love to connect."
  dm_long_template: |
    {greeting},

    Noticed {company} is hiring for {title}. The stack caught my eye — I've been shipping {stack} backends for 1-2 years.

    {achievements}

    Open to a 15-min chat to see if there's a fit?

    Thanks,
    {candidate_name}
  email_digest_subject_role: "backend"
  email_greeting: "Your Daily Job Digest"
